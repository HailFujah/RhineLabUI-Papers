name: Sync conference papers

on:
  push:
    paths:
      - ".github/workflows/sync-papers.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMLR metadata parser
        run: python -m pip install PyYAML==6.0.2
      - name: Fetch public conference metadata
        run: python scripts/sync-paper-database.py
      - name: Commit catalog updates
        run: |
          if git diff --quiet -- content/paper-live-catalog.json content/paper-live-index.json content/paper-live-provenance.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paper-live-catalog.json content/paper-live-index.json content/paper-live-provenance.json
          git commit -m "Sync conference paper metadata"
          git push

